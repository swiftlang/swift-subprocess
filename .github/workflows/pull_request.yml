name: Pull request

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

# TEMPORARY, REMOVE BEFORE MERGING, along with the `openbsd` job below.
#
# OpenBSD is the only platform this package supports that has no coverage in
# swiftlang/github-workflows, and it is the one platform where `posix_spawn` can
# express nothing this package needs: it has neither a close-all mechanism, nor
# POSIX_SPAWN_SETSID, nor an fchdir file action, so every spawn there takes the
# fork/exec path. Adapted from swift-toolchain-sqlite, which boots OpenBSD in
# QEMU under cloud-init and reports the exit status back through a tar tape.
env:
  OPENBSD_META_DATA_CONTENT: |
      {
        "instance-id": "iid-local01",
        "dsmode": "local"
      }
  OPENBSD_USER_DATA_CONTENT: |
      #cloud-config
      timezone: UTC
      write_files:
      - content: |
          set -ex
          function atexit {
              echo 1 > /tmp/result
              tar cvf /dev/sd1c -C /tmp result
              halt -p;
          }
          trap atexit EXIT
          printf '\033\143'
          export PATH=/usr/local/bin:$PATH
          mount /dev/sd3c /mnt
          cp -r /mnt/repo /home/repo/
          cd /home/repo/
          swift test
          echo $? > /tmp/result
          tar cvf /dev/sd1c -C /tmp result
          halt -p
        path: /etc/rc.local
        permissions: '0755'

jobs:
  tests:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.14
    with:
      linux_os_versions: '["amazonlinux2023", "bookworm", "noble", "jammy", "rhel-ubi9"]'
      linux_swift_versions: '["6.2", "nightly-main"]'
      linux_pre_build_command: |
        if command -v apt-get >/dev/null 2>&1 ; then # bookworm, noble, jammy
          # Test dependencies
          if command -v sudo &> /dev/null && [ "$EUID" -ne 0 ]; then
            sudo apt-get update -y
            sudo apt-get install -y procps
          else
            apt-get update -y
            apt-get install -y procps
          fi
        elif command -v dnf >/dev/null 2>&1 ; then # amazonlinux2023, rhel-ubi9
          dnf update -y

          # Test dependencies
          dnf install -y procps
        fi
      linux_exclude_swift_versions: '[{"swift_version": "6.2", "os_version": "amazonlinux2023"}]'
      linux_static_sdk_exclude_swift_versions: '[{"swift_version": "6.2", "os_version": "amazonlinux2023"}]'
      linux_build_command: "swift test && swift test -c release && swift test --disable-default-traits"
      enable_freebsd_checks: true
      freebsd_build_command: "swift test && swift test -c release && swift test --disable-default-traits"
      windows_swift_versions: '["6.2", "nightly-main"]'
      windows_build_command: |
        Invoke-Program swift test
        Invoke-Program swift test -c release
        Invoke-Program swift test --disable-default-traits
      enable_macos_checks: true
      macos_xcode_versions: '["swift_6.3", "swift_6.4"]'
      macos_build_command: "xcrun swift test && xcrun swift test -c release && xcrun swift test --disable-default-traits"
      enable_linux_static_sdk_build: true
      enable_android_sdk_build: true
      enable_android_sdk_checks: true
      android_ndk_versions: '["r27d", "r29"]'
      linux_static_sdk_versions: '["6.2", "nightly-main"]'
      linux_static_sdk_build_command: |
        for triple in aarch64-swift-linux-musl x86_64-swift-linux-musl ; do
          swift build --swift-sdk "\$triple"
          swift build --swift-sdk "\$triple" --disable-default-traits
        done
        # empty line to ignore the --swift-sdk given by swiftlang/github-workflows/.github/workflows/scripts/install-and-build-with-sdk.sh \

  test_linux_kernel:
    name: Test Linux Kernel / ${{ matrix.dist-kern }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # These are specific distro and kernel versions that the test qemu script supports from here: https://images.linuxcontainers.org
        dist-kern: ["al2-4.18", "al2-5.10"]
    container:
      image: ubuntu:24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run Test
        run: bash -c './scripts/test-using-qemu.sh ${{ matrix.dist-kern }} -- swift test'

  # TEMPORARY, REMOVE BEFORE MERGING, along with the `env` block above.
  openbsd:
    name: OpenBSD (7.8 - amd64)
    runs-on: ubuntu-latest
    # 30 minutes suffices for the `swift build` this was adapted from; the test
    # suite spawns thousands of processes inside an emulated guest.
    timeout-minutes: 90
    container:
      image: ghcr.io/3405691582/openbsd-swift-amd64:7.8
      env:
        CPU: "4"
        MEM: "16G"
        KVM: "-enable-kvm"
      options: --device /dev/kvm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write cloud-init files
        run: |
            echo "$OPENBSD_META_DATA_CONTENT" > /usr/local/share/cidata/meta-data
            echo "$OPENBSD_USER_DATA_CONTENT" > /usr/local/share/cidata/user-data

      - name: Prepare cloud-init
        run: |
            cp -r $GITHUB_WORKSPACE /usr/local/share/cidata/repo/ && \
            cat /usr/local/share/cidata/meta-data && \
            cat /usr/local/share/cidata/user-data && \
            ls /usr/local/share/cidata

      - name: Run
        run: /usr/local/bin/cmd.sh

      - name: Report
        run: |
            ls -l /usr/local/share/tape && \
            exit $(cat /usr/local/share/tape/result)

  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.14
    with:
      license_header_check_project_name: "Swift.org"
      docs_check_enabled: false
      format_check_enabled: true
      unacceptable_language_check_enabled: false
      api_breakage_check_enabled: false

  cmake_build:
    name: CMake Build
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-noble
    steps:
      - name: checkout sources
        uses: actions/checkout@v7
      - name: Install dependencies
        shell: bash
        run: apt update && apt install -y cmake ninja-build
      - name: Configure Project
        shell: bash
        run: cmake -G 'Ninja' -B build -S . -DCMAKE_C_COMPILER=clang -DCMAKE_Swift_COMPILER=swiftc -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=YES
      - name: Build Project
        shell: bash
        run: cmake --build build
